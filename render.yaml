services:
  - type: web
    name: nspector
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4173
    disk:
      name: nspector-data
      mountPath: /opt/render/project/src
      sizeGB: 1
