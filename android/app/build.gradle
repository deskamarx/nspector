plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nspector.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.nspector.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app is a WebView shell over the NSpector
// server UI, which removes a whole class of build and version conflicts.
dependencies { }